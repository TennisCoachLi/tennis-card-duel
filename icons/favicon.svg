<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <radialGradient id="inkBall" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="60%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
  </defs>
  <!-- 墨韵圆 - 网球主体 -->
  <circle cx="32" cy="32" r="26" fill="url(#inkBall)" filter="url(#ink)"/>
  <!-- 留白高光 -->
  <ellipse cx="24" cy="22" rx="6" ry="3" fill="#fff" opacity="0.18"/>
  <!-- 网球纹路 - 飞白笔触 -->
  <path d="M 12 18 Q 32 32 52 18" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M 12 46 Q 32 32 52 46" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.85"/>
  <!-- 飞白点缀 -->
  <path d="M 14 20 Q 16 21 18 22" stroke="#fff" stroke-width="1.2" fill="none" opacity="0.5"/>
  <path d="M 50 20 Q 48 21 46 22" stroke="#fff" stroke-width="1.2" fill="none" opacity="0.5"/>
</svg>
